<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王城決戦 リアルタイム観戦</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 600px;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 1.2rem;
            color: #f39c12;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-badge {
            background-color: #2ea44f;
            color: #ffffff;
            font-size: 0.8rem;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: bold;
        }
        .map-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 380px;
            background-color: #161b22;
            border: 2px solid #30363d;
            border-radius: 12px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .castle-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75px;
            height: 75px;
            background-color: #f1c40f;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #000;
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.5);
            font-size: 0.9rem;
        }
        .turret {
            position: absolute;
            width: 55px;
            height: 55px;
            background-color: #34495e;
            border: 2px solid #5d6d7e;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.75rem;
            color: #fff;
            font-weight: bold;
        }
        .turret.north { top: 25px; left: 50%; transform: translateX(-50%); }
        .turret.south { bottom: 25px; left: 50%; transform: translateX(-50%); }
        .turret.east  { top: 50%; right: 25px; transform: translateY(-50%); }
        .turret.west  { top: 50%; left: 25px; transform: translateY(-50%); }

        .timeline-container {
            width: 100%;
            max-width: 600px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
        }
        .timeline-title {
            font-size: 1rem;
            color: #c9d1d9;
            margin-bottom: 10px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 5px;
        }
        .timeline-item {
            padding: 8px 0;
            border-bottom: 1px solid #21262d;
            font-size: 0.85rem;
            color: #8b949e;
        }
        .troop-dot {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: #3498db;
            border: 2px solid #ffffff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.5s linear;
        }
        .troop-label {
            position: absolute;
            font-size: 10px;
            color: #3498db;
            white-space: nowrap;
            transform: translate(-50%, -18px);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>👑 王城決戦 リアルタイム観戦</h1>
        <span class="status-badge" id="statusBadge">ライブ受信中</span>
    </header>

    <div class="map-container" id="map">
        <!-- 中心王城 -->
        <div class="castle-center">王城</div>

        <!-- 砲台 -->
        <div class="turret north">北砲台</div>
        <div class="turret south">南砲台</div>
        <div class="turret east">東砲台</div>
        <div class="turret west">西砲台</div>

        <!-- 部隊アイコン動的追加領域 -->
        <div id="troopsArea"></div>
    </div>

    <div class="timeline-container">
        <div class="timeline-title">⌛ 進行タイムライン</div>
        <div id="timelineContent">
            <div class="timeline-item">データ取得中...</div>
        </div>
    </div>

    <script>
        // Firebase Realtime Database REST API 呼び出し先
        const FIREBASE_REST_URL = "https://wos-2205-default-rtdb.firebaseio.com/.json";

        const statusBadge = document.getElementById('statusBadge');
        const troopsArea = document.getElementById('troopsArea');
        const timelineContent = document.getElementById('timelineContent');

        // 1秒ごとにREST APIからデータ取得を実行
        async function fetchGameState() {
            try {
                const response = await fetch(FIREBASE_REST_URL, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                statusBadge.textContent = "ライブ受信中";
                statusBadge.style.backgroundColor = "#2ea44f";

                renderGameData(data);

            } catch (error) {
                console.error("Fetch Error:", error);
                statusBadge.textContent = "接続エラー";
                statusBadge.style.backgroundColor = "#cb2431";
            }
        }

        // 画面描画ロジック
        function renderGameData(data) {
            troopsArea.innerHTML = '';
            
            if (!data || !data.marches) {
                timelineContent.innerHTML = '<div class="timeline-item">現在進行中の行軍はありません</div>';
                return;
            }

            let timelineHtml = '';
            const marches = data.marches;

            Object.keys(marches).forEach(key => {
                const march = marches[key];
                
                // タイムラインの構築
                timelineHtml += `
                    <div class="timeline-item">
                        <strong>${march.name || '行軍部隊'}</strong> → ${march.target || '目標'}: 
                        ${march.status || '行軍中'}
                    </div>
                `;

                // マップ上の位置描画（座標が設定されている場合）
                if (march.posX !== undefined && march.posY !== undefined) {
                    const dot = document.createElement('div');
                    dot.className = 'troop-dot';
                    dot.style.left = `${march.posX}%`;
                    dot.style.top = `${march.posY}%`;

                    const label = document.createElement('div');
                    label.className = 'troop-label';
                    label.style.left = `${march.posX}%`;
                    label.style.top = `${march.posY}%`;
                    label.textContent = march.name || '部隊';

                    troopsArea.appendChild(dot);
                    troopsArea.appendChild(label);
                }
            });

            timelineContent.innerHTML = timelineHtml || '<div class="timeline-item">行軍情報なし</div>';
        }

        // 1000ms（1秒）間隔でポーリング実行
        setInterval(fetchGameState, 1000);
        // 初回即時実行
        fetchGameState();
    </script>
</body>
</html>
