<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Discord Activity用の CSP 設定 (Firebase通信を許可) -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' https://*.github.io;
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://*.firebaseapp.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        connect-src 'self' https://*.firebaseio.com wss://*.firebaseio.com https://*.googleapis.com;
        img-src 'self' data: https:;
    ">
  <title>👑 王城決戦 リアルタイム観戦画面</title>

  <!-- Firebase SDK (v9 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b0f19; color: #f8fafc; padding: 12px; max-width: 500px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    h1 { font-size: 1.1rem; color: #fbbf24; }
    .status-badge { font-size: 0.75rem; padding: 4px 8px; border-radius: 12px; background: #065f46; color: #34d399; font-weight: bold; }
    .map-wrapper { position: relative; width: 100%; aspect-ratio: 1; max-width: 420px; margin: 0 auto 12px; background: #0f172a; border: 2px solid #334155; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.6); }
    canvas { width: 100%; height: 100%; display: block; }
    .panel { background: #1e293b; padding: 12px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 12px; }
    .panel h2 { font-size: 0.85rem; color: #94a3b8; margin-bottom: 8px; border-bottom: 1px solid #334155; padding-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
    .timeline-container { background: #182234; border-radius: 8px; padding: 8px; margin-bottom: 8px; }
    .lane-title { font-size: 0.75rem; font-weight: bold; color: #cbd5e1; margin-bottom: 4px; display: flex; justify-content: space-between; }
    .track { position: relative; height: 28px; background: #0f172a; border-radius: 4px; overflow: hidden; margin-bottom: 4px; border: 1px solid #334155; }
    .bar { position: absolute; height: 100%; top: 0; left: 0; border-radius: 3px 0 0 3px; transition: width 0.1s linear; }
    .bar.wait { background: linear-gradient(90deg, #475569, #64748b); }
    .bar.prep { background: linear-gradient(90deg, #d97706, #f59e0b); }
    .bar.red { background: linear-gradient(90deg, #b91c1c, #ef4444); }
    .bar.blue { background: linear-gradient(90deg, #1d4ed8, #3b82f6); }
    .track-text { position: absolute; width: 100%; height: 100%; top: 0; left: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font-size: 0.75rem; font-weight: bold; color: #f8fafc; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); z-index: 2; pointer-events: none; }
  </style>
</head>
<body>

  <header>
    <h1>👑 王城決戦 リアルタイム観戦</h1>
    <div class="status-badge" id="syncStatus">🟢 ライブ受信中</div>
  </header>

  <div class="map-wrapper">
    <canvas id="mapCanvas" width="800" height="800"></canvas>
  </div>

  <div class="panel">
    <h2>⏳ 進行タイムライン</h2>
    <div id="timelineArea"></div>
  </div>

  <script>
    // ★★★ Firebase 設定（プロジェクトID: wos-2205） ★★★
    const firebaseConfig = {
      apiKey: "AIzaSyCfTe-X7h0y_vCDdlQLyNAfvnbjk-BWOEE",
      authDomain: "wos-2205.firebaseapp.com",
      databaseURL: "https://wos-2205-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "wos-2205",
      storageBucket: "wos-2205.firebasestorage.app",
      messagingSenderId: "1037368490521",
      appId: "1:1037368490521:web:1046d913edf1cb7fbe0888",
      measurementId: "G-LJ4DTXCKEN"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const stateRef = db.ref('svs_sim_state');

    const DPRO = 2;
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');
    const WIDTH = canvas.width, HEIGHT = canvas.height;
    const CX = WIDTH / 2, CY = HEIGHT / 2;
    const DIAMOND_RADIUS = 150 * DPRO;

    let TARGETS = {
      castle:        { x: CX, y: CY, name: '王城' },
      turret_top:    { x: CX, y: CY - DIAMOND_RADIUS, name: '北砲台' },
      turret_bottom: { x: CX, y: CY + DIAMOND_RADIUS, name: '南砲台' },
      turret_left:   { x: CX - DIAMOND_RADIUS, y: CY, name: '西砲台' },
      turret_right:  { x: CX + DIAMOND_RADIUS, y: CY, name: '東砲台' }
    };

    let redTeamName = '赤陣営';
    let blueTeamName = '青陣営';
    let redPlayers = [];
    let bluePlayers = [];
    let isPaused = false;
    let virtualTime = 0;
    let lastRealTime = Date.now();
    let marches = [];
    let cities = { reds: [], blues: [], size: 10 * DPRO };

    stateRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      redTeamName = data.redTeamName || '赤陣営';
      blueTeamName = data.blueTeamName || '青陣営';
      redPlayers = data.redPlayers || [];
      bluePlayers = data.bluePlayers || [];
      
      if (data.targetNames) {
        TARGETS.castle.name = data.targetNames.castle || '王城';
        TARGETS.turret_top.name = data.targetNames.top || '北砲台';
        TARGETS.turret_bottom.name = data.targetNames.bottom || '南砲台';
        TARGETS.turret_left.name = data.targetNames.left || '西砲台';
        TARGETS.turret_right.name = data.targetNames.right || '東砲台';
      }

      marches = data.marches || [];
      virtualTime = data.virtualTime || 0;
      isPaused = !!data.isPaused;
      rebuildCities();
    });

    function rebuildCities() {
      const CITIES_PER_ROW = 10;
      const baseOffset = 25 * DPRO;
      const rowSpacing = 22 * DPRO;

      const generateGridPoints = (edgeList, playersList) => {
        const points = [];
        for (let idx = 0; idx < playersList.length; idx++) {
          const rowIndex = Math.floor(idx / CITIES_PER_ROW);
          const colIndex = idx % CITIES_PER_ROW;
          const edgeIdx = colIndex < 5 ? 0 : 1;
          const posOnEdge = colIndex % 5;
          const [p1, p2] = edgeList[edgeIdx];
          const dx = p2.x - p1.x, dy = p2.y - p1.y;
          let nx = -dy, ny = dx;
          const midX = (p1.x + p2.x) / 2, midY = (p1.y + p2.y) / 2;
          if ((midX - CX) * nx + (midY - CY) * ny < 0) { nx = -nx; ny = -ny; }
          const len = Math.hypot(nx, ny);
          const currentOffset = baseOffset + (rowIndex * rowSpacing);
          const ux = (nx / len) * currentOffset;
          const uy = (ny / len) * currentOffset;
          const t = (posOnEdge + 1) / 6;
          points.push({ x: p1.x + dx * t + ux, y: p1.y + dy * t + uy });
        }
        return points;
      };

      cities.reds = generateGridPoints([[TARGETS.turret_left, TARGETS.turret_top], [TARGETS.turret_bottom, TARGETS.turret_left]], redPlayers);
      cities.blues = generateGridPoints([[TARGETS.turret_top, TARGETS.turret_right], [TARGETS.turret_right, TARGETS.turret_bottom]], bluePlayers);
    }

    function drawMap() {
      ctx.clearRect(0, 0, WIDTH, HEIGHT);
      ctx.strokeStyle = '#334155'; ctx.lineWidth = 3 * DPRO; ctx.beginPath();
      ctx.moveTo(TARGETS.turret_top.x, TARGETS.turret_top.y);
      ctx.lineTo(TARGETS.turret_right.x, TARGETS.turret_right.y);
      ctx.lineTo(TARGETS.turret_bottom.x, TARGETS.turret_bottom.y);
      ctx.lineTo(TARGETS.turret_left.x, TARGETS.turret_left.y);
      ctx.closePath(); ctx.stroke();

      ctx.font = `bold ${7 * DPRO}px sans-serif`; ctx.textAlign = 'center';

      cities.reds.forEach((p, idx) => {
        ctx.fillStyle = '#ef4444'; ctx.fillRect(p.x - cities.size/2, p.y - cities.size/2, cities.size, cities.size);
        ctx.fillStyle = '#fca5a5'; ctx.fillText(redPlayers[idx] || `${redTeamName}${idx + 1}`, p.x, p.y - cities.size/2 - 3 * DPRO);
      });

      cities.blues.forEach((p, idx) => {
        ctx.fillStyle = '#3b82f6'; ctx.fillRect(p.x - cities.size/2, p.y - cities.size/2, cities.size, cities.size);
        ctx.fillStyle = '#93c5fd'; ctx.fillText(bluePlayers[idx] || `${blueTeamName}${idx + 1}`, p.x, p.y - cities.size/2 - 3 * DPRO);
      });

      ['turret_top', 'turret_right', 'turret_bottom', 'turret_left'].forEach(k => {
        const p = TARGETS[k];
        ctx.fillStyle = '#1e293b'; ctx.beginPath(); ctx.arc(p.x, p.y, 22 * DPRO, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#64748b'; ctx.lineWidth = 4 * DPRO; ctx.stroke();
        ctx.fillStyle = '#e2e8f0'; ctx.font = `bold ${9*DPRO}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(p.name, p.x, p.y);
      });

      const castle = TARGETS.castle;
      ctx.fillStyle = '#eab308'; ctx.beginPath(); ctx.arc(castle.x, castle.y, 34 * DPRO, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#64748b'; ctx.lineWidth = 5 * DPRO; ctx.stroke();
      ctx.fillStyle = '#000'; ctx.font = `bold ${10*DPRO}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(castle.name, castle.x, castle.y);

      marches.forEach(m => {
        const target = TARGETS[m.targetKey];
        if (!m.startPos) return;
        if (virtualTime < m.rallyStartTime) return;
        if (virtualTime < m.rallyEndTime) {
          ctx.fillStyle = '#f59e0b'; ctx.beginPath(); ctx.arc(m.startPos.x, m.startPos.y - 12 * DPRO, 5 * DPRO, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#fbbf24'; ctx.font = `bold ${6 * DPRO}px sans-serif`; ctx.fillText('⚔️集結中', m.startPos.x, m.startPos.y - 19 * DPRO);
        } else {
          const elapsed = virtualTime - m.rallyEndTime;
          const total = m.marchEndTime - m.rallyEndTime;
          const progress = Math.min(Math.max(elapsed / total, 0), 1);
          const curX = m.startPos.x + (target.x - m.startPos.x) * progress;
          const curY = m.startPos.y + (target.y - m.startPos.y) * progress;
          ctx.strokeStyle = m.team === 'red' ? '#ef4444' : '#3b82f6'; ctx.lineWidth = 3 * DPRO; ctx.beginPath(); ctx.moveTo(m.startPos.x, m.startPos.y); ctx.lineTo(curX, curY); ctx.stroke();
          ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(curX, curY, 6 * DPRO, 0, Math.PI * 2); ctx.fill();
        }
      });
    }

    function renderTimeline() {
      const area = document.getElementById('timelineArea');
      area.innerHTML = '';
      Object.keys(TARGETS).forEach(key => {
        const t = TARGETS[key];
        const targetMarches = marches.filter(m => m.targetKey === key && m.marchEndTime > virtualTime);
        const container = document.createElement('div');
        container.className = 'timeline-container';
        let html = `<div class="lane-title"><span>🏰 ${t.name}</span><span>${targetMarches.length} 件</span></div>`;

        if (targetMarches.length === 0) {
          html += `<div style="font-size:0.7rem; color:#64748b; text-align:center;">行軍なし</div>`;
        } else {
          targetMarches.forEach(m => {
            let widthPct = 0, statusText = '', barClass = '';
            if (virtualTime < m.rallyStartTime) {
              const remWait = Math.ceil(m.rallyStartTime - virtualTime);
              widthPct = 100; statusText = `⏳ 発起待機 (【${m.targetTimeDisplay}】着弾に向けてあと ${remWait}s 後に発起)`; barClass = 'wait';
            } else if (virtualTime < m.rallyEndTime) {
              const totalRally = m.rallyDurationSec || 300;
              const remaining = Math.max(0, Math.ceil(m.rallyEndTime - virtualTime));
              widthPct = Math.min(Math.max((1 - remaining / totalRally) * 100, 3), 100); statusText = `⚔️ 集結中 (出発まで ${remaining}s / 目標: ${m.targetTimeDisplay})`; barClass = 'prep';
            } else {
              const totalMarch = m.marchEndTime - m.rallyEndTime;
              const elapsedMarch = virtualTime - m.rallyEndTime;
              const progress = Math.min(Math.max(elapsedMarch / totalMarch, 0), 1);
              const remaining = Math.max(0, Math.ceil(m.marchEndTime - virtualTime));
              widthPct = Math.min(Math.max(progress * 100, 3), 100);
              statusText = `${m.rallyDurationSec > 0 ? '⚔️ 集結行軍' : '🏹 単騎'} (着弾まで ${remaining}s / 目標: ${m.targetTimeDisplay})`; barClass = m.team;
            }

            html += `
              <div class="track">
                <div class="bar ${barClass}" style="width: ${widthPct}%;"></div>
                <div class="track-text"><span>${m.playerName}</span><span>${statusText}</span></div>
              </div>
            `;
          });
        }
        container.innerHTML = html;
        area.appendChild(container);
      });
    }

    function loop() {
      const now = Date.now();
      const delta = (now - lastRealTime) / 1000;
      lastRealTime = now;
      if (!isPaused) virtualTime += delta;
      drawMap(); renderTimeline();
      requestAnimationFrame(loop);
    }

    rebuildCities();
    loop();
  </script>
</body>
</html>
